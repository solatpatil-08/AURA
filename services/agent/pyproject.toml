[project]
name = "aura-agent"
version = "0.1.0"
description = "AURA Agent Core - Local AI reasoning and conversation service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.38",
    "greenlet>=3.1.1",
    "aiosqlite>=0.21.0",
    "faster-whisper>=1.2.0",
    "av>=11,<18",
    "piper-tts>=1.8.0",
    "python-multipart>=0.0.20",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
